name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
      
    - name: Restore NuGet packages
      run: dotnet restore
      
    - name: Create the app package
      run: msbuild . /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}
      
    - name: Copy EXE files
      run: mkdir ./bin && ls "./*/bin/${{ matrix.configuration }}/Rbx*" |% {mv ($_.FullName) "./bin/$($_.BaseName).${{ matrix.configuration }}$($_.Extension)"}
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Generate release data
      shell: bash
      run: |
        export TZ=UTC0
        export LC_ALL=en_US.utf8
        GIT_COMMIT_ID=$(echo "${{ github.sha }}" |  cut -c 1-7)
        UPDATE_TIME=$(git log -1 --format=%cd --date=format-local:%Y%m%dT%H%M%SZ)
        echo "tag_name=v${UPDATE_TIME}" >> $GITHUB_ENV
        echo "release_name=${UPDATE_TIME} (${GIT_COMMIT_ID})" >> $GITHUB_ENV

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ env.release_name }}
        tag_name: ${{ env.tag_name }}
        files: ./bin/*
